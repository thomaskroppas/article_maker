# SEO Pipeline — dev-окружение (ТЗ 19.1).
# Локально nginx не поднимается (profile production).
#   docker compose up -d
# Хостовые порты вынесены в env (неконфликтные дефолты): фронт :3010, API :8010,
# postgres :5433, redis :6380 — переопределяются в .env. ВНУТРИ docker-сети сервисы
# общаются по именам (postgres:5432, redis:6379) — хостовые порты на это не влияют.
# Секреты берутся из .env (не коммитится). Инфраструктурные URL заданы явно ниже
# и переопределяют возможные значения из .env внутри контейнеров.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://seo:seo@postgres:5432/seo_pipeline
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo_pipeline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    volumes:
      - ./prompts:/app/prompts:ro
      - ./fixtures:/app/fixtures:ro                 # dev/тесты: MockLLMClient + схемы
      - ./reference_article:/app/reference_article:ro  # dev/тесты
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - ./prompts:/app/prompts:ro
      - ./fixtures:/app/fixtures:ro                 # dev/тесты: MockLLMClient + схемы
      - ./reference_article:/app/reference_article:ro  # dev/тесты
      - ./data:/app/data
      - ./logs:/app/logs
    # Переопределяем HEALTHCHECK из образа backend (curl :8000) — воркер не слушает
    # HTTP. Проверяем живость celery-ноды через inspect ping (нужен брокер).
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3010}:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.25
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
